  <!-- Theme Toggle -->
  <button class="theme-toggle" id="themeToggle" title="Alternar tema Claro/Escuro">🌙</button>
  <script>
    (function() {
      var btn = document.getElementById('themeToggle');
      var root = document.documentElement;
      function update() {
        var isLight = root.classList.contains('theme-light');
        btn.textContent = isLight ? '☀️' : '🌙';
        btn.title = isLight ? 'Mudar para tema Escuro' : 'Mudar para tema Claro';
      }
      update();
      btn.addEventListener('click', function() {
        root.classList.toggle('theme-light');
        localStorage.setItem('hp-theme', root.classList.contains('theme-light') ? 'light' : 'dark');
        update();
      });
    })();
  </script>
